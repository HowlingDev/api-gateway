server:
  error:
    include-message: always
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: {EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true

logging:
  org.springframework.security: TRACE

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
          enabled: true
      server:
        webmvc:
          routes:
            - id: flow-manager-service
              uri: lb://FLOW-MANAGER
              predicates:
                - Path=api/files/**
              filters:
                - StripPrefix=1
                - TokenRelay=
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_RESOURCE_SERVER}
      client:
        provider:
          keycloak:
            issuer-uri: ${OAUTH2_RESOURCE_SERVER}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid