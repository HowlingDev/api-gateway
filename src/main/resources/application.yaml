server:
  error:
    include-message: always
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: {EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
          enabled: true
      server:
        webmvc:
          routes:
            - id: flow-manager-service
              uri: lb://FLOW-MANAGER
              predicates:
                - Path=api/files/**
              filters:
                - StripPrefix=1